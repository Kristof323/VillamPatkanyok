<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Villámpatkányok kezelése és CSV exportálása"
    />
    <title>Villámpatkányok</title>
  </head>

  <body>
    <main class="app">
      <div class="container">
        <h1>Villámpatkányok</h1>

        <form id="rat-form" class="rat-form">
          <label for="rat-name">A villámpatkány neve</label>

          <input
            id="rat-name"
            type="text"
            placeholder="Például: Zizegő"
            autocomplete="off"
          />

          <button type="submit">
            Villámpatkány hozzáadása
          </button>
        </form>

        <p id="error-message" class="error-message"></p>

        <p id="empty-message" class="empty-message">
          Még nincs létrehozott villámpatkány.
        </p>

        <section class="rats-section">
          <div id="rats-container" class="rats-grid"></div>
        </section>

        <section class="export-section">
          <h2>CSV export</h2>

          <div class="export-buttons">
            <button id="show-csv-button" type="button">
              CSV megjelenítése
            </button>

            <button id="download-csv-button" type="button">
              CSV letöltése
            </button>
          </div>

          <label for="csv-output" class="visually-hidden">
            CSV adatok
          </label>

          <textarea
            id="csv-output"
            rows="8"
            readonly
            placeholder="A CSV-adatok itt jelennek meg..."
          ></textarea>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
